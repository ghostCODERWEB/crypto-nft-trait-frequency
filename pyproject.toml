[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-nft-trait-frequency"
version = "0.1.0"
description = "Compute collection trait frequencies, inverse-frequency scores and deterministic ranks with missing-trait treatment."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-nft-trait-frequency = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
